apis:
- aid: federal-accounting-standards-advisory-board-wp-content
  name: FASAB Public Content API (WordPress REST)
  description: 'The anonymous, read-only WordPress REST API behind fasab.gov. Serves FASAB''s site pages (Standards
    & Guidance, handbook-by-chapter, active and archived projects, board and ASIC meeting material, briefing documents,
    training and the resources library), its small post corpus, the media library, the category/tag/Link Library
    taxonomies, public author records and cross-type site search. DERIVED contract — FASAB publishes no specification;
    the OpenAPI here was derived from the live route discovery document at https://fasab.gov/wp-json/ (saved verbatim
    alongside it) and all 28 operations were confirmed HTTP 200 to unauthenticated requests on 2026-09-09. Read-only:
    collection responses carry Allow: GET and the entire administrative and plugin surface answers 401 rest_forbidden
    anonymously. The authoritative FASAB Handbook, SFFAS statements and technical releases are PDFs on files.fasab.gov
    linked from page content, not records in this API.'
