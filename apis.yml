aid: federal-accounting-standards-advisory-board
name: Federal Accounting Standards Advisory Board
description: The Federal Accounting Standards Advisory Board (FASAB) is the U.S. federal advisory body
  designated to set generally accepted accounting principles for the federal government and its component
  reporting entities. FASAB issues Statements of Federal Financial Accounting Standards (SFFAS), technical
  releases, interpretations and staff implementation guidance, consolidates them into the FASAB Handbook,
  and runs the public due-process cycle of board and ASIC meetings, active projects and exposure drafts
  open for comment. FASAB publishes no developer program or specification, but fasab.gov runs on WordPress
  and serves the WordPress REST API anonymously at https://fasab.gov/wp-json/ — a read-only surface over
  402 pages, 214 media records, the site taxonomies and search, whose OpenAPI here was derived from that
  live route index. The authoritative pronouncements remain PDFs on files.fasab.gov.
