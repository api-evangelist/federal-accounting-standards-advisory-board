openapi: 3.1.0
info:
  title: FASAB Public Content API (WordPress REST)
  version: wp/v2
  summary: The anonymous, read-only WordPress REST API serving fasab.gov content — federal accounting standards pages, board
    and project material, the media library, taxonomies and site search.
  description: |-
    The Federal Accounting Standards Advisory Board publishes no developer program, no API documentation and no machine-readable specification of its own. Its website, fasab.gov, runs on WordPress VIP and serves the standard WordPress REST API anonymously at https://fasab.gov/wp-json/ , and that surface is a real, callable, machine-readable read API over FASAB content: 402 pages (Standards & Guidance, handbook-by-chapter, active and archived projects, board meetings and briefing materials, ASIC, training and the resources library), 4 posts, 214 media records, 41 reusable content blocks, the site's taxonomies, its public author records and cross-type site search.

    THIS DOCUMENT IS DERIVED, NOT PUBLISHED BY FASAB. Every path, method, parameter and parameter schema below comes from the live WordPress route discovery document at https://fasab.gov/wp-json/ , saved verbatim alongside this file as federal-accounting-standards-advisory-board-wp-routes-original.json (519 routes). Every operation listed here was individually confirmed to return HTTP 200 to an unauthenticated request on 2026-09-09; the confirming URL and status are recorded on each operation as x-verified.

    READ ONLY, AND DELIBERATELY SO. Collection responses carry `Allow: GET`. The route index advertises POST/PUT/PATCH/DELETE on most content routes and a large administrative and plugin surface (settings, plugins, themes, widgets, templates, block-types, revisions, users/me, application-passwords, and the jetpack/v4, wpcom/v2, vip/v1, akismet/v1, cron-control/v1, two-factor/1.0, publishpress-future/v1, jetpack-boost/v1, my-jetpack/v1, wp-site-health/v1, wp-block-editor/v1, form_maker/v1, amp/v1 and wp-abilities/v1 namespaces). All of it requires authentication — /wp/v2/settings, /wp/v2/plugins, /wp/v2/themes, /wp/v2/block-types, /wp/v2/users/me, /wp/v2/posts/{id}/revisions and /wp-abilities/v1/abilities each returned 401 rest_forbidden anonymously on 2026-09-09 — so none of it is a public API and none of it is modelled here.

    WHAT THIS API IS NOT. The authoritative FASAB pronouncements themselves — the FASAB Handbook, SFFAS statements, technical releases and interpretations — are published as PDFs on files.fasab.gov and are linked from page content. They are not exposed as structured records by this API. An agent can use this API to find the page that carries a standard and the URL of its PDF; it cannot query the text of a standard as data.
  contact:
    name: FASAB
    email: fasab@fasab.gov
    url: https://fasab.gov/about-fasab/contact-information/
  license:
    name: U.S. Government Work (17 U.S.C. Sec. 105)
    url: https://fasab.gov/
  x-provenance:
    method: derived
    source: https://fasab.gov/wp-json/
    derived: '2026-09-09'
    verbatim_source_file: openapi/federal-accounting-standards-advisory-board-wp-routes-original.json
    note: Derived by API Evangelist from the live WordPress route discovery document served by fasab.gov. Not authored,
      published or endorsed by FASAB.
servers:
- url: https://fasab.gov/wp-json
  description: WordPress REST root on fasab.gov. Verified reachable and anonymous on 2026-09-09. www.fasab.gov serves the
    identical site.
security:
- {}
tags:
- name: Pages
  description: FASAB site pages — standards and guidance, projects, board meetings, ASIC, training, resources.
- name: News
  description: Posts and comments.
- name: Documents
  description: The media library of uploaded files and images.
- name: Taxonomy
  description: Categories, tags and the Link Library taxonomies.
- name: Authors
  description: Public author records for FASAB staff who publish content.
- name: Search
  description: Cross-type site search.
- name: Discovery
  description: Route index, content types, taxonomies, statuses and oEmbed.
paths:
  /:
    get:
      operationId: getRouteIndex
      summary: Route discovery index
      description: The WordPress REST API root. Returns the site name, home URL, the list of registered namespaces and the
        full route index — 519 routes, of which the 29 modelled in this document are the ones reachable without authentication.
      tags:
      - Discovery
      security:
      - {}
      parameters:
      - name: context
        in: query
        required: false
        schema:
          default: view
      responses:
        '200':
          description: Success. A JSON document.
          content:
            application/json:
              schema:
                type: object
        '400':
          description: Invalid parameter. WordPress error envelope.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPError'
        '401':
          description: Not authorised for the requested context or field. WordPress error envelope with code rest_forbidden.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPError'
        '404':
          description: No route or resource matched. WordPress error envelope with code rest_no_route or rest_post_invalid_id.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WPError'
      x-verified:
        url: https://fasab.gov/wp-json/
        http_status: 200
        checked: '2026-09-09'
        anonymous: true
