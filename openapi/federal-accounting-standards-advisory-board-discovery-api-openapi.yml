  /oembed/1.0/embed:
    get:
      operationId: getOembed
      summary: oEmbed for a fasab.gov URL
      description: oEmbed 1.0 provider endpoint. Returns title, author, provider and an embed HTML fragment for any fasab.gov permalink.
      tags:
      - Discovery
      security:
      - {}
      parameters:
      - name: url
        in: query
        required: true
        schema:
          type: string
          format: uri
        description: The URL of the resource for which to fetch oEmbed data.
      - name: format
        in: query
        required: false
        schema:
          default: json
      - name: maxwidth
        in: query
        required: false
        schema:
