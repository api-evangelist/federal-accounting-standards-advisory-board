      x-verified:
        url: https://fasab.gov/wp-json/wp/v2
        http_status: 200
        checked: '2026-09-09'
        anonymous: true
  /wp/v2/types:
    get:
      operationId: listContentTypes
      summary: List content types
      description: Every registered post type with its rest_base, namespace, taxonomies and per-type field schema — the machine-readable description of what content shapes exist on this site.
      tags:
      - Discovery
      security:
      - {}
      parameters:
      - name: context
        in: query
        required: false
        schema:
          type: string
          enum:
          - view
          - embed
          - edit
          default: view
        description: Scope under which the request is made; determines fields present in response.
      responses:
        '200':
